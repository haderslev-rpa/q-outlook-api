[project]
name = "q-outlook-api"
version = "0.1.0"
description = "outlook-api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "requests>=2.31.0",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_outlook_api"] #Husk det "ikke" skal være bindestreg
